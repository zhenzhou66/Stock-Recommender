name: Sync data to Supabase
# Price history for the charts is now fetched inside Supabase every weekday
# (see supabase/migrations/002_daily_price_job.sql). This Action only loads report files pushed to data/.

on:
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load reports and stock snapshots
        run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
